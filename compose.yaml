# Trench: the whole stack with one command.
#   docker compose --env-file trench_frontend/.env.local up --build
# (--env-file supplies the NEXT_PUBLIC_* values for the frontend build.)
name: trench

services:
  # --- PostgreSQL 18, data kept in the "pgdata" volume -----------------------
  postgres:
    image: postgres:18
    env_file: trench_backend/.env.compose      # POSTGRES_USER / _PASSWORD / _DB
    volumes:
      - pgdata:/var/lib/postgresql             # Postgres 18 data location
    ports:
      - "5433:5432"     # optional: lets DB tools on Windows connect (5432 is your local Postgres)
    healthcheck:
      # "ready" = accepting connections for our user + database
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- One-off job: migrations + provider seed, then exits -------------------
  migrate:
    image: trench-backend:dev                  # built by the backend service below
    env_file: trench_backend/.env.compose
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_provider_catalog.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- FastAPI backend ----------------------------------------------------------
  backend:
    build: ./trench_backend
    image: trench-backend:dev
    env_file: trench_backend/.env.compose
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully   # schema must be ready first
    deploy:
      resources:
        limits:
          memory: 512M                           # same limit as Render's free plan
    restart: unless-stopped

  # --- Next.js frontend ---------------------------------------------------------
  frontend:
    build:
      context: ./trench_frontend
      args:                                      # baked into the browser bundle
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    image: trench-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:     # named volume: survives `docker compose down` (removed only with -v)
