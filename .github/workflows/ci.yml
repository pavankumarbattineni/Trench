# Continuous Integration: lint, test, build and scan on every push and PR.
#
# Three independent jobs run in parallel on fresh Ubuntu machines:
#   backend  -> ruff lint + format check, migrations, pytest with coverage
#   frontend -> eslint, TypeScript type check, production build
#   docker   -> build both images (as Render/Compose will) + Trivy CVE scan
#
# Actions are pinned to full commit SHAs (tags can be moved by whoever
# controls the action's repo); Dependabot keeps the pins up to date.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trench_backend

    # A throwaway Postgres just for this job, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trench
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trench -d trench"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      LANGCHAIN_TRACING: "false"
      # Fake values only: every external API (Firebase, Pinecone, Gemini,
      # Groq, Cohere, LlamaParse, Backblaze, SMTP) is mocked in the tests,
      # so CI needs no real secrets. Only the database is real.
      TRENCH_CONFIG: >-
        {"ENVIRONMENT": "DEV",
         "FRONTEND_BASE_URL": "http://localhost:3000",
         "DB": {"username": "trench", "password": "ci", "database": "trench",
                "ip_address": "localhost", "port": "5432"},
         "JWT": {"secret_key": "ci-jwt-secret-not-a-real-secret-0123456789"},
         "ENCRYPTION": {"encryption_key": "ci-encryption-key-not-a-real-secret"},
         "FIREBASE": {"credentials_json_base64": "ci-fake", "web_api_key": "ci-fake"},
         "GROQ": {"api_key": "ci-fake"},
         "STORAGE": {"local_root_path": "/tmp/trench-storage"},
         "BACKBLAZE": {"endpoint_url": "https://s3.example.com", "region": "ci",
                       "bucket_name": "ci", "application_key_id": "ci-fake",
                       "application_key": "ci-fake"},
         "PINECONE": {"api_key": "ci-fake"},
         "LLAMAPARSE": {"api_key": "ci-fake"},
         "COHERE_RERANKER": {"api_key": "ci-fake"},
         "GEMINI": {"api_key": "ci-fake"},
         "SMTP": {"host": "localhost", "username": "ci", "password": "ci-fake",
                  "from_address": "ci@example.com"}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs uv and caches its downloads between runs (keyed on uv.lock).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: trench_backend/uv.lock

      # Exact versions from uv.lock, including dev tools (ruff, pytest).
      # Python 3.13 comes from .python-version / requires-python.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Formatting (ruff format --check)
        run: uv run ruff format --check .

      # Same order as the Compose "migrate" job: schema, then provider seed.
      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Seed provider catalog
        run: uv run python scripts/seed_provider_catalog.py

      - name: Tests (pytest + coverage)
        run: >-
          uv run pytest -q
          --cov=app --cov-report=term --cov-report=xml
          --junitxml=pytest-results.xml

      # Coverage total on the run's summary page.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Backend test coverage: {rate:.1f}%")
          EOF
          fi

      # coverage.xml + test results downloadable from the run page.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            trench_backend/coverage.xml
            trench_backend/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trench_frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders: the build only needs these to exist. Real values are
      # set per environment in Vercel (Step 7).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 (same as the Dockerfile) with npm's download cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trench_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Route/layout types (e.g. LayoutProps) are generated into .next/types,
      # which doesn't exist on a fresh checkout -- generate them first,
      # without a full build.
      - name: Type check (tsc)
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Trivy results to the Security tab
    strategy:
      fail-fast: false # one image failing shouldn't cancel the other's scan
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build exactly what Render/Compose build. load: true keeps the image
      # in the runner's Docker for the scan; nothing is pushed anywhere.
      # The GitHub Actions cache stores layers, so unchanged layers
      # (dependency installs) are reused on the next run.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: trench_${{ matrix.service }}
          tags: trench-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Frontend only (the backend Dockerfile declares no ARGs, so it
          # ignores these). Placeholders: src/lib/firebase.ts deliberately
          # fails the build when the Firebase config is missing.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder.appspot.com
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
            NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:ci

      # 1) Full report (all severities) -> GitHub Security tab. Never fails.
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trench-${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - name: Upload scan to Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # 2) The gate: fail the build on CRITICAL/HIGH vulnerabilities that
      # already have a fixed version available (i.e. ones we can act on).
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true" # reuse the DB downloaded by the step above
        with:
          image-ref: trench-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
