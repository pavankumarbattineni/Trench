[project]
name = "trench-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE"]
# B008: FastAPI's `= Depends(...)` default is the framework's documented DI
# pattern, not the mutable-default-argument bug this rule targets elsewhere.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; they're not hand-maintained code.
"alembic/versions/*.py" = ["I001", "UP035", "UP007", "PIE790", "F401", "E501"]
